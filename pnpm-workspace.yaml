# pnpm 11 reads build-script approval from here, not package.json.
# esbuild: tsx/vitest need its native binary (also provided via optional deps,
# but we allow the build so install doesn't hard-fail on ERR_PNPM_IGNORED_BUILDS).
# @launchql/protobufjs is a transitive dep of @supabase/lite we never use.
allowBuilds:
  '@launchql/protobufjs': false
  esbuild: true

# tsx pins esbuild below the fix for a Windows-only dev-server advisory.
# Patch-level, so forcing it is safe. Drop once tsx ships the patched range.
# Deliberately NOT overriding @hono/node-server: its fix is a major bump
# (1.x -> 2.x) inside @supabase/lite, and the advisory is Windows-only
# serve-static path traversal, which nothing here uses.
overrides:
  esbuild: '>=0.28.1'