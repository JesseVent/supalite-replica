name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — package.json "packageManager" pins it, and setting
      # both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The config unit tests always run. The kill-and-restore drill needs a
      # WAL-reset-safe Litestream on PATH; with none installed it skips, so CI
      # stays green without provisioning a binary. Run the drill locally — see
      # "Verifying the drill" in the README.
      - run: pnpm test